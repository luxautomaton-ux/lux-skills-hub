name: Refresh community skill snapshot

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh public community metadata
        run: node scripts/sync-community.mjs
      - name: Commit changes
        run: |
          if git diff --quiet -- data/community-snapshot.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "Lux Skills Hub Bot"
          git config user.email "skills-hub@users.noreply.github.com"
          git add data/community-snapshot.json
          git commit -m "chore: refresh community skill snapshot"
          git push
